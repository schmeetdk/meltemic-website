<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meltemic OÜ</title>
    <meta name="description" content="Meltemic OÜ – Software development and consulting services based in Estonia.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #111;
        }
        .tagline {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
        }
        .services {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 2rem;
        }
        .services h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            margin-bottom: 1rem;
        }
        .services p {
            color: #444;
        }
        .contact {
            font-size: 0.95rem;
            color: #666;
        }
        .contact a {
            color: #0066cc;
            text-decoration: none;
        }
        .contact a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meltemic OÜ</h1>
        <p class="tagline">Software development and consulting</p>
        
        <div class="services">
            <h2>What We Do</h2>
            <p>We build iOS and web applications, and provide software consulting services for businesses of all sizes.</p>
        </div>
        
        <p class="contact">
            Get in touch: <a href="mailto:hello@meltemic.com">hello@meltemic.com</a>
        </p>
        
        <footer>
            <p>Meltemic OÜ · Estonia</p>
        </footer>
    </div>
</body>
</html>
